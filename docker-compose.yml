services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lenzoocrm}
      POSTGRES_USER: ${POSTGRES_USER:-lenzoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - lenzoocrm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenzoo_user} -d ${POSTGRES_DB:-lenzoocrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lenzoo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lenzoocrm}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lenzoocrm_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lenzoocrm_network

volumes:
  postgres_data:

networks:
  lenzoocrm_network:
    driver: bridge
